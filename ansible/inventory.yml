---
# ============================================================
# inventory.yml — SuiteCRM MCP Gateway deployment inventory
# ============================================================
#
# Required on gateway host:
#   ansible_host             — IP or hostname of the gateway server
#   gateway_domain           — public FQDN (e.g. mcp.yourcompany.com)
#   gateway_email            — Let's Encrypt contact email
#   oauth_issuer             — OIDC issuer URL
#   oauth_client_id          — Auth0 / Azure AD application client ID
#   oauth_client_secret      — Auth0 / Azure AD application client secret (use vault)
#   oauth_audience           — custom API audience identifier
#
# Optional on gateway host:
#   skip_certbot             — set to true to skip HTTPS/certbot (default: false)
#
# Required per CRM VM:
#   ansible_host             — IP or hostname of the CRM VM
#   entity_code              — short code used everywhere (e.g. crm1)
#   label                    — human-readable name shown in gateway UI
#   port                     — MCP gateway port for this entity (3101, 3102, ...)
#   group                    — OIDC group name that gates access to this entity
#
# Optional per CRM VM:
#   api_path                 — REST API path if non-standard
#                              default: /legacy/service/v4_1/rest.php
#   acl_enabled              — create mcp_acl_reader MySQL user for ACL enforcement
#                              (default: false)
#   acl_root_user            — MySQL root/admin user for creating ACL user
#                              (default: root)
#   acl_root_pass            — MySQL root/admin password (use vault — never plain text)
#   acl_db_pass              — password for mcp_acl_reader user (auto-generated if unset)
#
# The CRM endpoint URL is auto-discovered from the VM's config.php.
# Store secrets in Ansible Vault — never commit plain text credentials.
# ============================================================

all:
  hosts:
    gateway:
      ansible_host: 10.0.0.1                          # IP of your gateway server
      ansible_user: ubuntu
      ansible_ssh_private_key_file: ~/.ssh/gateway.pem

      # --- Gateway install vars (required by gateway-install.yml) ---
      gateway_domain: mcp.yourcompany.com
      gateway_email: admin@yourcompany.com
      oauth_issuer: https://your-tenant.auth0.com
      oauth_client_id: YOUR_CLIENT_ID
      oauth_client_secret: "{{ vault_oauth_client_secret }}"   # store in Ansible Vault
      oauth_audience: https://mcp.yourcompany.com

      # --- Optional ---
      # skip_certbot: true   # set if not using Let's Encrypt

  children:
    crm_vms:
      hosts:
        crm1-vm:
          ansible_host: 10.0.1.1                      # IP of CRM VM 1
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/gateway.pem
          entity_code: crm1
          label: "Main CRM"
          port: 3101
          group: crm1_users
          # acl_enabled: true
          # acl_root_user: root
          # acl_root_pass: "{{ vault_crm1_db_root_pass }}"

        crm2-vm:
          ansible_host: 10.0.1.2                      # IP of CRM VM 2
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/gateway.pem
          entity_code: crm2
          label: "Client B CRM"
          port: 3102
          group: crm2_users

        crm3-vm:
          ansible_host: 10.0.1.3                      # IP of CRM VM 3
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/gateway.pem
          entity_code: crm3
          api_path: /crm/legacy/service/v4_1/rest.php # override if non-standard
          label: "Client C CRM"
          port: 3103
          group: crm3_users
