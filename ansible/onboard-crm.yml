---
# ==============================================================
# onboard-crm.yml — Onboard CRM VMs to the suitecrm-mcp gateway
# ==============================================================
# Idempotent — safe to re-run anytime (e.g. when adding a new entity).
# Run after install.py has provisioned the gateway.
#
# Play 1 — push-crm-provisioner (crm_vms):
#   - Deploys crm-provision-user script to each CRM VM
#   - Adds gateway SSH public key to each CRM VM's authorized_keys
#   - Discovers SuiteCRM config.php and persists SUITECRM_CONFIG
#   - Updates SUITECRM_ENDPOINT in the entity .env on the gateway
#   - Updates crm-hosts.json on the gateway (SSH provisioning config)
#   - Restarts the entity MCP service if .env changed
#   - Runs a smoke test
#
# Play 2 — sync-gateway-config (gateway):
#   - Rebuilds entities.json from inventory + discovered endpoints
#   - Restarts suitecrm-mcp-auth if entities.json changed
#
# Play 3 — setup-acl-db-users (crm_vms, optional):
#   - Deploys mcp_acl_setup.sh, creates mcp_acl_reader SuiteCRM user (run-once)
#   - Fixes OAuth2 token lifetime to 30 days (run-once)
#   - Creates read-only MySQL mcp_acl_reader user for direct ACL queries (idempotent)
#   - Writes SUITECRM_ACL_* and SUITECRM_DB_* vars to entity .env on gateway
#   Enabled when: acl_enabled=true on the CRM VM in inventory (default: false)
#
# Run (all plays):
#   ansible-playbook -i ansible/inventory.yml ansible/onboard-crm.yml
#
# Run a single play by tag:
#   ansible-playbook -i ansible/inventory.yml ansible/onboard-crm.yml --tags crm
#   ansible-playbook -i ansible/inventory.yml ansible/onboard-crm.yml --tags config
#   ansible-playbook -i ansible/inventory.yml ansible/onboard-crm.yml --tags acl
# ==============================================================

# ==============================================================
# Play 1: push-crm-provisioner
# ==============================================================
- name: push-crm-provisioner - deploy API provisioner script and SSH key to CRM VMs
  hosts: crm_vms
  become: yes
  tags: crm

  vars:
    # Public key of the gateway server added to each CRM VM's authorized_keys.
    # Generate on the gateway: ssh-keygen -t ed25519 -f /etc/suitecrm-mcp/crm-ssh-key
    # Then paste the contents of /etc/suitecrm-mcp/crm-ssh-key.pub here.
    gateway_ssh_pubkey: "ssh-ed25519 AAAA...your-gateway-public-key... ubuntu@gateway"
    api_path_suffix: "{{ hostvars[inventory_hostname].api_path | default('/legacy/service/v4_1/rest.php') }}"
    gateway_ssh_user: ubuntu
    gateway_ssh_key: /etc/suitecrm-mcp/crm-ssh-key

  tasks:

    - name: Install required packages on CRM VM
      apt:
        name: [php-cli, php-mysql, curl, python3]
        state: present
        update_cache: no

    # ── Script deployment — redeploys if source changed ──────────
    - name: Check deployed script stat
      stat:
        path: /usr/local/bin/crm-provision-user
      register: script_stat

    - name: Check source script stat on gateway
      stat:
        path: "{{ playbook_dir }}/../tools/crm-provision-user.sh"
      register: source_stat
      delegate_to: gateway

    - name: Fetch crm-provision-user.sh from gateway
      slurp:
        src: "{{ playbook_dir }}/../tools/crm-provision-user.sh"
      register: script_content
      delegate_to: gateway
      when: >
        not script_stat.stat.exists or
        script_stat.stat.checksum | default('') != source_stat.stat.checksum

    - name: Deploy crm-provision-user script
      copy:
        content: "{{ script_content.content | b64decode }}"
        dest: /usr/local/bin/crm-provision-user
        owner: root
        group: root
        mode: '0755'
      when: script_content is defined and script_content.content is defined

    # ── SSH key ───────────────────────────────────────────────────
    - name: Add gateway SSH public key to authorized_keys
      authorized_key:
        user: ubuntu
        key: "{{ gateway_ssh_pubkey }}"
        state: present

    # ── Discover and persist SUITECRM_CONFIG ─────────────────────
    - name: Check if SUITECRM_CONFIG already set in /etc/environment
      shell: grep -c '^SUITECRM_CONFIG=' /etc/environment 2>/dev/null || echo 0
      register: config_already_set
      changed_when: false

    - name: Fetch config discovery script from gateway
      slurp:
        src: "{{ playbook_dir }}/../scripts/find-suitecrm-config.sh"
      register: discovery_script
      delegate_to: gateway
      when: config_already_set.stdout == "0"

    - name: Deploy config discovery script to CRM VM
      copy:
        content: "{{ discovery_script.content | b64decode }}"
        dest: /tmp/find-suitecrm-config.sh
        mode: '0755'
      when: config_already_set.stdout == "0"

    - name: Discover SuiteCRM config.php with highest user count
      shell: /tmp/find-suitecrm-config.sh
      register: suitecrm_config_path
      changed_when: false
      when: config_already_set.stdout == "0"

    - name: Cleanup discovery script
      file:
        path: /tmp/find-suitecrm-config.sh
        state: absent
      when: config_already_set.stdout == "0"

    - name: Read existing SUITECRM_CONFIG if already set
      shell: grep '^SUITECRM_CONFIG=' /etc/environment | cut -d= -f2 | head -1
      register: existing_config
      changed_when: false
      when: config_already_set.stdout != "0"

    - name: Set config path fact
      set_fact:
        final_config_path: "{{ (suitecrm_config_path.stdout if config_already_set.stdout == '0' else existing_config.stdout) | trim | regex_replace('\n.*', '') }}"

    - name: Fail if config.php not found
      fail:
        msg: "Could not find SuiteCRM config.php on {{ inventory_hostname }}"
      when: final_config_path == ""

    - name: Show config path
      debug:
        msg: "SuiteCRM config: {{ final_config_path }} ({{ 'newly discovered' if config_already_set.stdout == '0' else 'already set' }})"

    - name: Persist SUITECRM_CONFIG in /etc/environment
      lineinfile:
        path: /etc/environment
        regexp: '^SUITECRM_CONFIG='
        line: "SUITECRM_CONFIG={{ final_config_path }}"
        create: yes
      when: config_already_set.stdout == "0"

    # ── crm-hosts.json check ──────────────────────────────────────
    - name: Check if crm-hosts.json already has correct entry for this entity
      shell: |
        python3 -c "
        import json, sys
        from pathlib import Path
        path = Path('/etc/suitecrm-mcp/crm-hosts.json')
        if not path.exists(): sys.exit(1)
        hosts = json.loads(path.read_text())
        entity = '{{ hostvars[inventory_hostname].entity_code }}'
        config = '{{ final_config_path }}'
        current = hosts.get(entity, {}).get('command', '')
        starts_ok = current.startswith('SUITECRM_CONFIG=' + config)
        ends_ok = current.endswith('/usr/local/bin/crm-provision-user')
        sys.exit(0 if (starts_ok and ends_ok) else 1)
        "
      register: hosts_check
      delegate_to: gateway
      changed_when: false
      failed_when: false

    # ── Derive endpoint and update gateway config ─────────────────
    - name: Get site_url from config on CRM VM
      shell: >
        php -r "include('{{ final_config_path }}');
        echo \$sugar_config['site_url'] ?? '';" 2>/dev/null | tr -d '\n'
      register: site_url_result
      changed_when: false
      when: hosts_check.rc != 0

    - name: Set derived endpoint fact
      set_fact:
        derived_endpoint: "{{ site_url_result.stdout | trim | regex_replace('^http://', 'https://') }}{{ api_path_suffix }}"
      when:
        - hosts_check.rc != 0
        - site_url_result.stdout | trim != ""

    - name: Update SUITECRM_ENDPOINT in .env file on gateway
      lineinfile:
        path: /etc/suitecrm-mcp/{{ hostvars[inventory_hostname].entity_code }}.env
        regexp: '^SUITECRM_ENDPOINT='
        line: "SUITECRM_ENDPOINT={{ derived_endpoint }}"
      delegate_to: gateway
      become: yes
      register: env_updated
      when:
        - hosts_check.rc != 0
        - derived_endpoint is defined
        - derived_endpoint != ""

    - name: Get CRM endpoint for this entity
      shell: >
        grep '^SUITECRM_ENDPOINT='
        /etc/suitecrm-mcp/{{ hostvars[inventory_hostname].entity_code }}.env
        | cut -d= -f2
      register: entity_endpoint
      delegate_to: gateway
      changed_when: false
      when: hosts_check.rc != 0

    # ── Update crm-hosts.json on gateway ─────────────────────────
    - name: Fetch update-crm-host.sh from gateway
      slurp:
        src: "{{ playbook_dir }}/../scripts/update-crm-host.sh"
      register: update_script
      delegate_to: gateway
      when: hosts_check.rc != 0

    - name: Deploy update-crm-host.sh on gateway
      copy:
        content: "{{ update_script.content | b64decode }}"
        dest: /tmp/update-crm-host.sh
        mode: '0755'
      delegate_to: gateway
      become: yes
      when: hosts_check.rc != 0

    - name: Run update-crm-host.sh on gateway
      shell: |
        /tmp/update-crm-host.sh \
          "{{ hostvars[inventory_hostname].entity_code }}" \
          "{{ final_config_path }}" \
          "{{ derived_endpoint | default(entity_endpoint.stdout | default('') | trim) }}" \
          "{{ site_url_result.stdout | default('') | trim }}" \
          "{{ hostvars[inventory_hostname].ansible_host | default(inventory_hostname) }}" \
          "{{ gateway_ssh_user }}" \
          "{{ gateway_ssh_key }}"
        rm -f /tmp/update-crm-host.sh
      delegate_to: gateway
      become: yes
      when: hosts_check.rc != 0

    # ── Restart MCP service if .env changed ──────────────────────
    - name: Restart MCP service on gateway to apply .env changes
      shell: >
        systemctl restart suitecrm-mcp-{{ hostvars[inventory_hostname].entity_code }} 2>/dev/null ||
        echo "WARNING: could not restart service"
      delegate_to: gateway
      become: yes
      changed_when: false
      failed_when: false
      when:
        - env_updated is defined
        - env_updated.changed | default(false)

    # ── Smoke test ────────────────────────────────────────────────
    - name: Test crm-provision-user script (DB connection check)
      shell: "SUITECRM_CONFIG={{ final_config_path }} crm-provision-user __test__ __test__"
      register: test_result
      failed_when: >
        ('not found in SuiteCRM database' not in (test_result.stderr + test_result.stdout)) and
        ('DB set, API verify failed' not in (test_result.stderr + test_result.stdout)) and
        ('API endpoint unreachable' not in (test_result.stderr + test_result.stdout))
      changed_when: false

    # ── OAuth2 RSA key generation (opt-in, run-once) ─────────────
    # Set generate_oauth_keys: true in inventory to enable.
    # Keys are generated as the web server user so ownership is
    # correct from the start. Path is derived from config.php location.
    - name: Check OAuth2 key generation flag
      set_fact:
        _do_oauth_keys: "{{ hostvars[inventory_hostname].generate_oauth_keys | default(false) | bool }}"

    - name: Derive OAuth2 key directory from config.php path
      set_fact:
        oauth2_key_dir: "{{ final_config_path | dirname }}/Api/V8/OAuth2"
      when: _do_oauth_keys

    - name: Check if OAuth2 keys already exist
      stat:
        path: "{{ oauth2_key_dir }}/private.key"
      register: oauth2_key_stat
      when: _do_oauth_keys

    - name: Detect web server user
      shell: |
        # 1. apachectl -S (most reliable on RHEL/Amazon Linux)
        WS_USER=$(apachectl -S 2>/dev/null | grep -oP '(?<=User: name=")[^"]+' | head -1)

        # 2. Running process (works when apachectl not in PATH)
        if [ -z "$WS_USER" ]; then
          WS_USER=$(ps aux 2>/dev/null \
            | grep -E '\b(apache2|httpd|nginx)\b' \
            | grep -v root | grep -v grep \
            | head -1 | awk '{print $1}')
        fi

        # 3. Apache envvars (Debian/Ubuntu)
        if [ -z "$WS_USER" ]; then
          WS_USER=$(grep '^export APACHE_RUN_USER=' /etc/apache2/envvars 2>/dev/null \
            | cut -d= -f2 | tr -d '"')
        fi

        # 4. httpd.conf User directive
        if [ -z "$WS_USER" ]; then
          WS_USER=$(grep -r '^User ' /etc/httpd/conf/ /etc/apache2/ 2>/dev/null \
            | awk '{print $2}' | head -1)
        fi

        # 5. Common fallbacks
        if [ -z "$WS_USER" ]; then
          for u in apache www-data httpd nginx; do
            id "$u" &>/dev/null && WS_USER="$u" && break
          done
        fi

        echo "${WS_USER:-www-data}"
      register: ws_user_result
      changed_when: false
      when:
        - _do_oauth_keys
        - not oauth2_key_stat.stat.exists | default(true)

    - name: Set web server user fact
      set_fact:
        ws_user: "{{ ws_user_result.stdout | trim }}"
      when:
        - _do_oauth_keys
        - not oauth2_key_stat.stat.exists | default(true)

    - name: Stat existing OAuth2 directory to match permissions
      stat:
        path: "{{ oauth2_key_dir }}"
      register: oauth2_dir_stat
      when:
        - _do_oauth_keys
        - not oauth2_key_stat.stat.exists | default(true)

    - name: Create OAuth2 key directory if missing
      file:
        path: "{{ oauth2_key_dir }}"
        state: directory
        owner: "{{ ws_user }}"
        group: "{{ ws_user }}"
        mode: "{{ oauth2_dir_stat.stat.mode | default('0750') }}"
      when:
        - _do_oauth_keys
        - not oauth2_key_stat.stat.exists | default(true)

    - name: Generate RSA private key as web server user
      shell: sudo -u "{{ ws_user }}" openssl genrsa -out "{{ oauth2_key_dir }}/private.key" 2048
      when:
        - _do_oauth_keys
        - not oauth2_key_stat.stat.exists | default(true)

    - name: Derive RSA public key as web server user
      shell: >
        sudo -u "{{ ws_user }}" openssl rsa
        -in "{{ oauth2_key_dir }}/private.key"
        -pubout -out "{{ oauth2_key_dir }}/public.key"
      when:
        - _do_oauth_keys
        - not oauth2_key_stat.stat.exists | default(true)

    - name: Lock down key permissions
      file:
        path: "{{ oauth2_key_dir }}/{{ item }}"
        owner: "{{ ws_user }}"
        group: "{{ ws_user }}"
        mode: '0600'
      loop:
        - private.key
        - public.key
      when:
        - _do_oauth_keys
        - not oauth2_key_stat.stat.exists | default(true)

    - name: Verify web server user can read private key
      shell: sudo -u "{{ ws_user }}" head -1 "{{ oauth2_key_dir }}/private.key"
      register: key_verify_priv
      changed_when: false
      failed_when: "'PRIVATE KEY' not in key_verify_priv.stdout"
      when:
        - _do_oauth_keys
        - not oauth2_key_stat.stat.exists | default(true)

    - name: Verify web server user can read public key
      shell: sudo -u "{{ ws_user }}" head -1 "{{ oauth2_key_dir }}/public.key"
      register: key_verify_pub
      changed_when: false
      failed_when: "'PUBLIC KEY' not in key_verify_pub.stdout"
      when:
        - _do_oauth_keys
        - not oauth2_key_stat.stat.exists | default(true)

    - name: Report OAuth2 key status
      debug:
        msg: >
          {{ oauth2_key_dir }}: {{ 'keys already exist — skipped' if oauth2_key_stat.stat.exists | default(false)
          else 'generated as ' + (ws_user | default('unknown')) + ' — private.key + public.key OK' }}
      when: _do_oauth_keys

    - name: Confirm CRM VM deployment
      debug:
        msg: >
          {{ inventory_hostname }} ({{ hostvars[inventory_hostname].entity_code }}) ready —
          config: {{ final_config_path }} |
          endpoint: {{ derived_endpoint | default(entity_endpoint.stdout | default('not changed') | trim) }}


# ==============================================================
# Play 2: Sync gateway config files from inventory
# ==============================================================
- name: sync-gateway-config - rebuild entities.json and restart auth if changed
  hosts: gateway
  become: yes
  tags: [crm, config]

  handlers:
    - name: restart auth
      systemd:
        name: suitecrm-mcp-auth
        state: restarted

  tasks:

    # ── entities.json ─────────────────────────────────────────────
    - name: Write entities.json from inventory + .env endpoints
      shell: |
        python3 - << 'PYEOF'
        import json, os, pwd, grp
        from pathlib import Path

        base = json.loads('{{ _inv | to_json }}')

        for code, data in base.items():
            try:
                for line in open(f"/etc/suitecrm-mcp/{code}.env"):
                    if line.startswith("SUITECRM_ENDPOINT="):
                        data["endpoint"] = line.strip().split("=", 1)[1]
                        break
            except FileNotFoundError:
                data.setdefault("endpoint", "")

        path = Path("/etc/suitecrm-mcp/entities.json")
        old = {}
        if path.exists():
            try:
                old = json.loads(path.read_text())
            except Exception:
                pass
            st = os.stat(str(path))
            uid, gid = st.st_uid, st.st_gid
        else:
            uid = pwd.getpwnam("suitecrm-mcp").pw_uid
            gid = grp.getgrnam("suitecrm-mcp").gr_gid

        if old == base:
            print("UNCHANGED")
        else:
            tmp = str(path) + ".tmp." + str(os.getpid())
            Path(tmp).write_text(json.dumps(base, indent=2) + "\n")
            os.chown(tmp, uid, gid)
            os.chmod(tmp, 0o600)
            os.replace(tmp, str(path))
            print("CHANGED:", list(base.keys()))
        PYEOF
      vars:
        _inv: >-
          {%- set d = {} -%}
          {%- for h in groups['crm_vms'] -%}
            {%- set v = hostvars[h] -%}
            {%- set _ = d.update({v.entity_code: {
                "label": v.label | default(v.entity_code),
                "port":  v.port  | int,
                "group": v.group | default(v.entity_code ~ '_users')
            }}) -%}
          {%- endfor -%}
          {{ d }}
      register: entities_result
      changed_when: "'CHANGED' in entities_result.stdout"
      notify: restart auth

    - name: Show entities.json status
      debug:
        msg: "entities.json: {{ entities_result.stdout | trim }}"


# ==============================================================
# Play 3: ACL enforcement setup (optional — set acl_enabled: true)
# ==============================================================
# Two things happen here:
#
# A) mcp_acl_setup.sh (run-once via marker):
#    - Deploys tools/mcp_acl_setup.sh to /usr/local/bin/ on each CRM VM
#    - Creates mcp_acl_reader SuiteCRM application user (users table)
#    - Fixes OAuth2 token lifetime to 30 days
#    - Generates a random password, saves it to /etc/suitecrm-mcp/.acl-user-pass
#    - Writes SUITECRM_ACL_USER / SUITECRM_ACL_PASS to the entity .env on gateway
#    - Skipped on re-runs (marker: /etc/suitecrm-mcp/.acl-user-setup-done)
#
# B) MySQL read-only user (idempotent, every run):
#    - Creates mcp_acl_reader MySQL user with SELECT-only on the CRM DB
#    - Writes SUITECRM_DB_* vars to the entity .env on gateway
#    - Used by acl-check.mjs for direct DB ACL queries
# ==============================================================
- name: setup-acl-db-users - deploy mcp_acl_setup.sh and create ACL users on each CRM VM
  hosts: crm_vms
  become: yes
  tags: acl

  vars:
    acl_enabled: false   # override in inventory: acl_enabled: true

  tasks:

    - name: Skip ACL setup if not enabled
      meta: end_play
      when: not acl_enabled | bool

    - name: Install required packages on CRM VM
      apt:
        name: [mysql-client, python3-mysqldb, php-cli]
        state: present
        update_cache: no

    # ── Read config path set by Play 1 ───────────────────────────
    - name: Read SUITECRM_CONFIG from /etc/environment
      shell: grep '^SUITECRM_CONFIG=' /etc/environment | cut -d= -f2 | head -1
      register: config_path_raw
      changed_when: false

    - name: Set config path fact
      set_fact:
        crm_config_path: "{{ config_path_raw.stdout | trim }}"

    - name: Fail if SUITECRM_CONFIG not set (run crm-fleet-sync.yml Play 1 first)
      fail:
        msg: "SUITECRM_CONFIG not set on {{ inventory_hostname }} — run crm-fleet-sync.yml Play 1 first."
      when: crm_config_path == ""

    # ── Deploy mcp_acl_setup.sh (one-time tool, stays on VM) ─────
    - name: Fetch mcp_acl_setup.sh from repo on gateway
      slurp:
        src: "{{ playbook_dir }}/../tools/mcp_acl_setup.sh"
      register: acl_setup_script
      delegate_to: gateway

    - name: Deploy mcp_acl_setup.sh to /usr/local/bin/
      copy:
        content: "{{ acl_setup_script.content | b64decode }}"
        dest: /usr/local/bin/mcp_acl_setup.sh
        owner: root
        group: root
        mode: '0755'

    # ── SuiteCRM user + token fix (run-once) ─────────────────────
    - name: Check if SuiteCRM ACL user setup already done
      stat:
        path: /etc/suitecrm-mcp/.acl-user-setup-done
      register: acl_marker

    - name: Create /etc/suitecrm-mcp dir on CRM VM if missing
      file:
        path: /etc/suitecrm-mcp
        state: directory
        owner: root
        group: root
        mode: '0750'
      when: not acl_marker.stat.exists

    - name: Generate random password for mcp_acl_reader SuiteCRM user
      set_fact:
        acl_suitecrm_pass: "{{ lookup('password', '/tmp/acl_suitecrm_pass_' ~ hostvars[inventory_hostname].entity_code ~ ' length=24 chars=ascii_letters,digits') }}"
      when: not acl_marker.stat.exists
      no_log: true

    - name: Create mcp_acl_reader SuiteCRM user via mcp_acl_setup.sh
      shell: >
        mcp_acl_setup.sh --user-only
        --config "{{ crm_config_path }}"
        --password "{{ acl_suitecrm_pass }}"
      register: acl_user_result
      when: not acl_marker.stat.exists
      no_log: true

    - name: Fix OAuth2 token lifetime to 30 days via mcp_acl_setup.sh
      shell: >
        mcp_acl_setup.sh --token-only
        --config "{{ crm_config_path }}"
      register: acl_token_result
      when: not acl_marker.stat.exists

    - name: Show token fix output
      debug:
        msg: "{{ acl_token_result.stdout_lines | default([]) }}"
      when: not acl_marker.stat.exists

    - name: Save SuiteCRM ACL user password on CRM VM
      copy:
        content: "SUITECRM_ACL_USER=mcp_acl_reader\nSUITECRM_ACL_PASS={{ acl_suitecrm_pass }}\n"
        dest: /etc/suitecrm-mcp/.acl-user-pass
        owner: root
        group: root
        mode: '0600'
      when: not acl_marker.stat.exists
      no_log: true

    - name: Write SUITECRM_ACL_* vars to entity .env on gateway
      blockinfile:
        path: /etc/suitecrm-mcp/{{ hostvars[inventory_hostname].entity_code }}.env
        marker: "# {mark} ACL SUITECRM USER (managed by ansible/crm-fleet-sync.yml)"
        block: |
          SUITECRM_ACL_USER=mcp_acl_reader
          SUITECRM_ACL_PASS={{ acl_suitecrm_pass }}
        owner: suitecrm-mcp
        group: suitecrm-mcp
        mode: '0600'
      delegate_to: gateway
      become: yes
      when: not acl_marker.stat.exists
      no_log: true

    - name: Set run-once marker for SuiteCRM ACL user setup
      file:
        path: /etc/suitecrm-mcp/.acl-user-setup-done
        state: touch
        owner: root
        group: root
        mode: '0600'
      when: not acl_marker.stat.exists

    - name: Report SuiteCRM ACL user setup
      debug:
        msg: "{{ inventory_hostname }} SuiteCRM ACL user: {{ 'created' if not acl_marker.stat.exists else 'already set up (marker exists)' }}"

    # ── MySQL read-only user (idempotent) ─────────────────────────
    - name: Extract DB credentials from config.php
      shell: |
        php -r "
        include('{{ crm_config_path }}');
        \$h = \$sugar_config['dbconfig']['db_host_name'] ?? \$sugar_config['db_host_name'] ?? '';
        \$n = \$sugar_config['dbconfig']['db_name']       ?? \$sugar_config['db_name']       ?? '';
        \$p = \$sugar_config['dbconfig']['db_port']       ?? \$sugar_config['db_port']       ?? '3306';
        echo implode('\n', [\$h, \$n, \$p]);
        " 2>/dev/null
      register: db_info_raw
      changed_when: false

    - name: Parse DB credentials
      set_fact:
        crm_db_host: "{{ db_info_raw.stdout_lines[0] | trim }}"
        crm_db_name: "{{ db_info_raw.stdout_lines[1] | trim }}"
        crm_db_port: "{{ db_info_raw.stdout_lines[2] | trim | default('3306') }}"

    - name: Fail if DB host could not be determined
      fail:
        msg: "Could not read db_host_name from {{ crm_config_path }}"
      when: crm_db_host == ""

    # ── Determine connecting IP (what MySQL sees from gateway) ────
    - name: Probe connecting IP as seen by MySQL
      shell: |
        mysql -h "{{ crm_db_host }}" -P "{{ crm_db_port }}" \
          -u x -px 2>&1 | grep -oP "(?<=user 'x'@')[\d\.]+" || true
      register: connecting_ip_result
      delegate_to: gateway
      changed_when: false
      failed_when: false

    - name: Set connecting IP fact
      set_fact:
        acl_connecting_ip: "{{ connecting_ip_result.stdout | trim }}"
      when: connecting_ip_result.stdout | trim != ""

    - name: Fallback connecting IP to gateway ansible_host
      set_fact:
        acl_connecting_ip: "{{ hostvars['gateway'].ansible_host }}"
      when: connecting_ip_result.stdout | trim == ""

    # ── Generate MySQL reader password ────────────────────────────
    - name: Generate mcp_acl_reader MySQL password (idempotent via lookup)
      set_fact:
        acl_db_pass: "{{ hostvars[inventory_hostname].acl_db_pass | default(lookup('password', '/tmp/acl_mysql_pass_' ~ hostvars[inventory_hostname].entity_code ~ ' length=24 chars=ascii_letters,digits')) }}"
      no_log: true

    # ── Create MySQL read-only user ───────────────────────────────
    - name: Create mcp_acl_reader MySQL read-only user
      shell: |
        mysql -h "{{ crm_db_host }}" -P "{{ crm_db_port }}" \
          -u "{{ hostvars[inventory_hostname].acl_root_user | default('root') }}" \
          -p"{{ hostvars[inventory_hostname].acl_root_pass }}" \
          "{{ crm_db_name }}" << 'SQL'
        CREATE USER IF NOT EXISTS 'mcp_acl_reader'@'{{ acl_connecting_ip }}' IDENTIFIED BY '{{ acl_db_pass }}';
        GRANT SELECT ON {{ crm_db_name }}.* TO 'mcp_acl_reader'@'{{ acl_connecting_ip }}';
        FLUSH PRIVILEGES;
        SQL
      register: mysql_result
      changed_when: "'already exists' not in mysql_result.stderr"
      no_log: true

    # ── Write DB vars to entity .env on gateway ───────────────────
    - name: Write SUITECRM_DB_* vars to entity .env on gateway
      blockinfile:
        path: /etc/suitecrm-mcp/{{ hostvars[inventory_hostname].entity_code }}.env
        marker: "# {mark} ACL DB CONFIG (managed by ansible/crm-fleet-sync.yml)"
        block: |
          SUITECRM_DB_HOST={{ crm_db_host }}
          SUITECRM_DB_PORT={{ crm_db_port }}
          SUITECRM_DB_NAME={{ crm_db_name }}
          SUITECRM_DB_USER=mcp_acl_reader
          SUITECRM_DB_PASS={{ acl_db_pass }}
        owner: suitecrm-mcp
        group: suitecrm-mcp
        mode: '0600'
      delegate_to: gateway
      become: yes
      register: acl_env_updated
      no_log: true

    - name: Restart entity MCP service to apply ACL DB config
      systemd:
        name: "suitecrm-mcp-{{ hostvars[inventory_hostname].entity_code }}"
        state: restarted
      delegate_to: gateway
      become: yes
      when: acl_env_updated.changed

    - name: Verify MySQL read-only connection from gateway
      shell: |
        mysql -h "{{ crm_db_host }}" -P "{{ crm_db_port }}" \
          -u mcp_acl_reader -p"{{ acl_db_pass }}" \
          "{{ crm_db_name }}" -e "SELECT 1;" 2>&1
      delegate_to: gateway
      register: acl_verify
      changed_when: false
      no_log: true

    - name: Report ACL setup result
      debug:
        msg: "ACL for {{ hostvars[inventory_hostname].entity_code }}: MySQL user {{ 'OK' if acl_verify.rc == 0 else 'FAILED - ' + acl_verify.stderr }}"
