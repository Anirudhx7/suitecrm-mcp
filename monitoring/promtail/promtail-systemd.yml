server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: suitecrm-mcp-journal
    journal:
      path: /var/log/journal
      max_age: 12h
      labels:
        job: suitecrm-mcp
    relabel_configs:
      - source_labels: ['__journal__systemd_unit']
        regex: 'suitecrm-mcp.*\.service'
        action: keep
      - source_labels: ['__journal__systemd_unit']
        target_label: unit
      - source_labels: ['__journal__hostname']
        target_label: hostname
    pipeline_stages:
      - json:
          expressions:
            level: level
            entity: entity
            audit: audit
            msg: msg
      - replace:
          expression: '^suitecrm_'
          replace: ''
          source: entity
      - labels:
          level:
          entity:
          audit:
