# SuiteCRM MCP Monitoring Stack
# Used by install.py - deployed to /opt/suitecrm-mcp-monitoring/
# All secrets and URLs come from .env (generated by install.py on first run).
#
# For Docker-based gateway deployments see the root docker-compose.yml instead.

services:

  prometheus:
    image: prom/prometheus:v3.11.3
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=60d
      - --storage.tsdb.retention.size=8GB
      - --web.enable-lifecycle
      - --web.external-url=${GATEWAY_URL:-http://localhost}/prometheus
      - --web.route-prefix=/
    extra_hosts:
      - "host-gateway:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.0.1
    ports:
      - "0.0.0.0:3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_SERVER_ROOT_URL: "${GATEWAY_URL:-http://localhost}/grafana"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    sysctls:
      net.ipv4.tcp_keepalive_time: 60
      net.ipv4.tcp_keepalive_intvl: 10
      net.ipv4.tcp_keepalive_probes: 6
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.2
    ports:
      - "0.0.0.0:3200:3100"
    volumes:
      - ./loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/loki.yml
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.32.1
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.external-url=${GATEWAY_URL:-http://localhost}/alertmanager
      - --web.route-prefix=/
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.6.11
    volumes:
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - ./promtail.yml:/etc/promtail/promtail.yml:ro
      - promtail_positions:/promtail
    command: -config.file=/etc/promtail/promtail.yml
    depends_on:
      - loki
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.83.0
    # host network so it can reach Redis on 127.0.0.1:6379
    network_mode: host
    environment:
      REDIS_ADDR: "${REDIS_ADDR:-redis://127.0.0.1:6379}"
    restart: unless-stopped

  redis-commander:
    image: rediscommander/redis-commander:latest
    # host network so it can reach Redis on 127.0.0.1:6379
    network_mode: host
    environment:
      REDIS_HOSTS: "${REDIS_HOSTS:-local:127.0.0.1:6379}"
      HTTP_USER: ${REDIS_COMMANDER_USER:-admin}
      HTTP_PASSWORD: ${REDIS_COMMANDER_PASSWORD:?Set REDIS_COMMANDER_PASSWORD in .env}
      PORT: "8081"
      URL_PREFIX: "/redis"
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  promtail_positions:
